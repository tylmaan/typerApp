[project]
name = "typerApp"
version = "0.1.0"
description = "Football score prediction game for a group of friends"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[dependency-groups]
tui = [
    "textual>=0.80",
]
gui = [
    "PySide6>=6.7",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
default-groups = ["dev", "tui"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typerapp_core", "src/typerapp_tui", "src/typerapp_gui"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["typerapp_core", "typerapp_tui", "typerapp_gui"]
known-local-folder = ["helpers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
